['web','O que é um site?',6,'Um site é um conjunto de arquivos que o navegador interpreta.','Quando você abre um endereço, o navegador recebe arquivos e transforma HTML em estrutura, CSS em visual e JavaScript em comportamento. Você pode começar com um único arquivo .html no Neocities.',['HTML descreve o conteúdo; CSS controla o visual; JS responde a ações.','O navegador lê e interpreta o código — não precisa “compilar” um HTML simples.','Um endereço na web leva a arquivos que podem estar hospedados em um servidor.'],['<h1>Meu primeiro site</h1>\n<p>Estou construindo a minha página.</p>','h1 { color: #33c7a3; }',''],'Crie uma página com um título e dois parágrafos.','Qual linguagem cria o título visível?', ['HTML','CSS','SQL'],0,'A tag h1 pertence ao HTML.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Getting_started/Your_first_website'],
['editor','Arquivos, pastas e extensões',7,'Aprenda a encontrar a peça certa antes de escrever.','O nome do arquivo importa: index.html é normalmente a página inicial. Você também pode criar sobre.html, foto.png ou estilo.css. Caminhos relativos são resolvidos a partir da localização do arquivo que faz a referência.',['index.html costuma abrir ao visitar a raiz do endereço.','Arquivos .css guardam estilos e .js guardam scripts.','Nomes e maiúsculas/minúsculas podem influenciar o caminho.'],['<h1>Arquivos fazem parte do projeto</h1>\n<a href="sobre.html">Página sobre</a>','body { font-family: sans-serif; }',''],'Escreva três nomes de arquivos e diga para que cada um serve.','Qual é o nome comum do arquivo inicial?', ['principal.txt','index.html','style.docx'],1,'index.html é o arquivo inicial mais habitual.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Getting_started/Environment_setup/Dealing_with_files'],
['esqueleto','O esqueleto do HTML',9,'Uma única ordem correta resolve muitos erros.','O documento começa com <!DOCTYPE html>, seguido de html. Dentro de html existem head (metadados) e body (conteúdo visível). Nunca abra um segundo head dentro do body.',['head contém title, meta e links para estilos.','body contém títulos, textos, imagens, botões e outras partes visíveis.','Tags de abertura e fechamento precisam formar uma hierarquia coerente.'],['<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n  <meta charset="UTF-8">\n  <title>Meu mundo</title>\n</head>\n<body>\n  <h1>Meu mundo</h1>\n</body>\n</html>','',''],'Reescreva de memória html, head e body na ordem certa.','Onde fica o h1 que aparece na página?', ['No body','No head','No title'],0,'Elementos visíveis ficam no body.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Structuring_content/Basic_HTML_syntax'],
['head','Head, header e body não são iguais',8,'Três nomes parecidos, três funções diferentes.','head é uma região de configurações do documento. header é uma tag semântica VISÍVEL usada para cabeçalho de página ou seção. body contém o conteúdo exibido. Um header pode ficar dentro do body, mas um head não.',['head não é uma área visual da página.','header é uma seção do conteúdo, com logo, título ou navegação.','Você pode ter mais de um header em seções diferentes.'],['<header>\n  <h1>Bem-vindo</h1>\n  <nav><a href="#sobre">Sobre</a></nav>\n</header>\n<main id="sobre"><p>Minha história.</p></main>','',''],'Explique com suas palavras por que <header> pode ficar em <body>, mas <head> não.','Qual é o cabeçalho visível?', ['head','header','meta'],1,'header é elemento semântico de conteúdo.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/header'],
['comentario','Comentários, indentação e erros',8,'Faça o código ficar legível para você mesmo.','Comentários anotam decisões sem aparecer no conteúdo; indentação ajuda a enxergar quem está dentro de quem. HTML usa <!-- comentário --> e CSS usa /* comentário */. Um navegador muitas vezes tenta recuperar HTML inválido, mas isso não torna o código correto.',['Indente dois ou quatro espaços por nível.','Não aninhe tags sem fechar as anteriores de modo correto.','Leia as mensagens do console e valide o documento.'],['<!-- Comentário HTML -->\n<h1>Organização</h1>\n<p>Um parágrafo sem confusão.</p>','/* Comentário CSS */\nh1 { color: #67e1c0; }',''],'Adicione um comentário HTML antes do título e um comentário CSS antes da cor.','Qual comentário funciona em CSS?', ['<!-- oi -->','/* oi */','# oi'],1,'Comentários CSS são delimitados por /* e */.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/Comments'],
['ligacao','Como conectar HTML, CSS e JS',9,'O trio que vai acompanhar você até projetos avançados.','Você pode usar style dentro do head e script no documento. Em projetos maiores, costuma separar estilos e scripts em arquivos externos. Um arquivo CSS não recebe tags HTML; um arquivo JS não recebe declarações de CSS soltas.',['<link rel="stylesheet" href="estilo.css"> no head.','<script src="app.js" defer><\/script> carrega um arquivo JS.','Para o Neocities, os três tipos de arquivo funcionam no navegador.'],['<h1 id="titulo">Três linguagens</h1>\n<button id="botao">Clique</button>','body { background:#152333;color:white; font-family:Arial; }','document.querySelector("#botao").addEventListener("click", () => {\n  document.querySelector("#titulo").textContent = "Funcionou!";\n});'],'Troque o texto do título quando o botão for clicado.','O que muda o conteúdo após um clique?', ['CSS sozinho','JavaScript','A extensão .png'],1,'O JS escuta o clique e altera o elemento.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Getting_started/Your_first_website/Adding_interactivity'],
['neocities','Seu primeiro fluxo no Neocities',10,'Editar, salvar, visitar e conferir.','O Neocities hospeda arquivos estáticos: HTML, CSS, JavaScript e mídia. No editor de arquivos, abra a página desejada, altere o código, salve e visite o endereço. Atualize a página quando necessário; o navegador pode mostrar uma cópia em cache.',['Faça uma cópia do index.html antes de mudanças grandes.','Se já existe um site, crie manual.html sem substituir index.html.','HTML/CSS/JS de navegador funcionam; PHP e banco de dados no servidor não rodam no Neocities como hospedagem estática.'],['<h1>Minha página no Neocities</h1>\n<p>Eu consigo publicar.</p>','body { padding: 36px; font-family: sans-serif; }',''],'Crie uma página com nome diferente de index.html e acesse pelo endereço /nomedapagina.html.','Que arquivo você deve evitar sobrescrever sem backup?', ['index.html','rascunho.txt','foto.jpg'],0,'index.html pode ser a página principal que já está publicada.','https://neocities.org/tutorials'],
['mentalidade','Como aprender sem decorar tudo',7,'Aprender a pesquisar é parte de programar.','Profissionais consultam documentação o tempo inteiro. Primeiro identifique o problema, reduza o exemplo, teste uma alteração e observe o resultado. O objetivo é entender por que funciona, não guardar cada propriedade na memória.',['Experimente modificar um detalhe de cada vez.','Guarde exemplos próprios e crie versões pequenas.','Use o dicionário e o diagnóstico deste manual sempre que travar.'],['<h1>Teste A</h1>\n<p>Qual cor você vê?</p>','p { color: tomato; font-size: 22px; }',''],'Troque apenas color e depois apenas font-size; compare os efeitos.','Qual caminho ajuda mais a descobrir um erro?', ['Mudar tudo','Testar uma alteração por vez','Apagar tudo sem ler'],1,'Isolar variáveis torna o diagnóstico mais simples.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development']
]},
{ id:'html', nome:'HTML sem medo', nivel:'Iniciante', cor:'#8ab5ff', resumo:'Estrutura, texto, links, imagens, formulários e semântica.', aulas:[
['titulos','Títulos, parágrafos e hierarquia',7,'h1 a h6, p e a lógica de uma página.','h1 marca o título principal do conteúdo. h2 e h3 organizam subtópicos; o número representa nível de seção, não um controle direto do tamanho visual. Para tamanho, use font-size no CSS.',['Escolha títulos pela estrutura, não só pela aparência.','Use p para parágrafos e não para criar espaço artificial.','Uma hierarquia coerente ajuda acessibilidade e leitura.'],['<h1>Meu mundo</h1>\n<h2>O que eu gosto</h2>\n<p>Gosto de aprender criando.</p>\n<h3>Música</h3>\n<p>Meu som favorito.</p>','',''],'Crie uma página com h1, dois h2 e um h3 bem organizados.','Qual tag indica um subtítulo de segundo nível?', ['h2','p','strong'],0,'h2 define um título de nível 2.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/Heading_Elements'],
['listas','Listas e itens',6,'ul, ol e li para não improvisar.','ul cria uma lista sem ordem numérica; ol cria uma lista ordenada; li representa cada item. Para listas de termos e definições existem dl, dt e dd.',['ul é ótima para gostos, tópicos e navegação.','ol é útil para passos e sequências.','li deve ser filho de ul ou ol (ou menu).'],['<h2>Coisas que eu gosto</h2>\n<ul>\n  <li>Música</li>\n  <li>Café</li>\n  <li>Aprender</li>\n</ul>\n<h2>Passos</h2>\n<ol><li>Escrever</li><li>Salvar</li></ol>','',''],'Transforme sua lista de gostos em uma lista de tarefas numerada.','Qual elemento cria lista ordenada?', ['ul','ol','li'],1,'ol numera a sequência automaticamente.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/ol'],
['links','Links e caminhos',9,'Navegue entre páginas e seções.','a cria um link com href. Links absolutos incluem o domínio; relativos indicam arquivos ou caminhos no mesmo site. Use ids para levar a uma seção com href="#id".',['Texto do link deve explicar o destino.','Para links externos com target="_blank", use rel="noopener noreferrer".','Um href incorreto é uma das causas mais comuns de páginas quebradas.'],['<nav><a href="#sobre">Sobre</a> · <a href="https://neocities.org" target="_blank" rel="noopener noreferrer">Neocities</a></nav>\n<h2 id="sobre">Sobre mim</h2>\n<p>Esta é minha seção.</p>','',''],'Faça um link que leve ao seu subtítulo “Coisas que eu gosto”.','Qual atributo define o destino de um link?', ['src','href','alt'],1,'href informa para onde a âncora aponta.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/a'],
['imagens','Imagens e texto alternativo',9,'img, src, alt e proporções.','img insere uma imagem; src aponta o endereço; alt descreve a imagem para acessibilidade e situações em que ela não carrega. Para uma imagem decorativa, alt="" pode ser adequado.',['Arquivos locais precisam de caminho certo, como imagens/foto.png.','max-width: 100% evita que imagens transbordem em telas pequenas.','Não dependa de links temporários de busca para imagens importantes.'],['<h1>Meu mural</h1>\n<img src="https://picsum.photos/500/260" alt="Fotografia ilustrativa aleatória" width="500" height="260">','img { max-width:100%; height:auto; border-radius:18px; }',''],'Troque o endereço pela imagem de seu Neocities e escreva um alt útil.','Que atributo descreve uma imagem?', ['alt','title','class'],0,'alt fornece alternativa textual.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/img'],
['div-span','div, span, class e id',9,'Aprenda a agrupar e selecionar.','div é um contêiner genérico em bloco; span é um contêiner genérico em linha. class identifica um grupo reutilizável e id identifica um elemento específico no documento. Antes de usar div, veja se existe tag semântica apropriada.',['Classes podem se repetir em diversos elementos.','IDs precisam ser únicos por página.','class e id são as pontes para selecionar com CSS e JS.'],['<div class="cartao">\n  <h2>Meu perfil</h2>\n  <p>Eu gosto de <span class="marca">criar</span>.</p>\n</div>','.cartao { background:#24364b; color:white; padding:22px; border-radius:18px; }\n.marca { color:#70e8c7; }',''],'Crie dois cartões com a mesma classe e observe o CSS se repetir.','Qual identificador deve ser único na página?', ['class','id','span'],1,'id identifica um elemento específico.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Global_attributes/id'],
['semantica','Header, main, section, article e footer',9,'Dê significado ao que você constrói.','Elementos semânticos descrevem o papel de uma região: header introduz, nav navega, main contém conteúdo principal, section agrupa um tema, article é autocontido e footer encerra informações da região/página.',['Use main uma vez para o conteúdo principal visível.','section costuma precisar de um título para descrever o tema.','A semântica beneficia navegação por tecnologias assistivas.'],['<header><h1>Meu site</h1></header>\n<nav><a href="#vida">Vida</a></nav>\n<main><section id="vida"><h2>Minha vida</h2><p>Um pouco sobre mim.</p></section></main>\n<footer>Feito por mim.</footer>','',''],'Reorganize sua página pessoal usando header, main e footer.','Qual elemento normalmente contém o conteúdo principal?', ['main','head','meta'],0,'main representa a parte principal do documento.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/main'],
['tabelas','Tabelas e dados',8,'Quando usar table e quando não usar.','table é feita para dados tabulares. tr forma linhas, th indica cabeçalhos, td indica células. Não use tabelas para montar o layout inteiro do site; CSS Grid e Flexbox cumprem esse papel.',['thead e tbody organizam regiões da tabela.','th com scope ajuda a relacionar cabeçalhos e dados.','Em telas estreitas, considere rolagem horizontal.'],['<table>\n<thead><tr><th scope="col">Dia</th><th scope="col">Estudo</th></tr></thead>\n<tbody><tr><td>Segunda</td><td>HTML</td></tr><tr><td>Terça</td><td>CSS</td></tr></tbody>\n</table>','table { border-collapse:collapse; } th,td { border:1px solid #999; padding:10px; }',''],'Monte uma tabela para organizar seu estudo por dia.','Qual tag indica uma célula de cabeçalho?', ['td','th','tr'],1,'th representa o cabeçalho da tabela.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/table'],
['formulario','Formulários: input, label e button',10,'Receba dados do visitante.','Form agrupa controles; label associa texto ao campo; input recebe dados; button executa uma ação. No Neocities, HTML sozinho não cria um banco para receber envios: para persistência remota é necessário um serviço externo ou backend.',['Use label for associado ao id do input.','type="email" solicita formato de e-mail, mas não garante segurança.','button dentro de form costuma enviar o formulário se não definir type.'],['<form id="formulario">\n  <label for="nome">Seu nome</label>\n  <input id="nome" name="nome" required>\n  <button type="submit">Enviar</button>\n</form>\n<p id="resultado"></p>','label,input,button { display:block; margin:8px 0; }','document.querySelector("#formulario").addEventListener("submit",e=>{e.preventDefault();document.querySelector("#resultado").textContent="Olá, "+document.querySelector("#nome").value;});'],'Crie um formulário que cumprimente o visitante usando JavaScript.','Qual elemento descreve o campo de formulário?', ['label','script','hr'],0,'label é o rótulo de um controle.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Extensions/Forms'],
['atributos','Atributos essenciais e acessibilidade',9,'As informações extras dentro de cada tag.','Atributos configuram elementos: lang informa idioma; charset define codificação; title pode fornecer informação complementar; aria-label pode nomear controles quando falta nome visível. Não use ARIA para substituir HTML semântico adequado.',['lang="pt-BR" ajuda leitores de tela.','meta viewport habilita responsividade em celulares.','Atributos booleanos como disabled funcionam pela presença.'],['<html lang="pt-BR">\n<!-- No arquivo completo, meta viewport fica no head -->\n<button type="button" aria-label="Abrir menu">Menu</button>','',''],'Verifique lang, meta charset e meta viewport no seu arquivo.','Que atributo indica o idioma do documento?', ['alt','lang','href'],1,'lang informa o idioma primário.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Global_attributes/lang'],
['midia','Vídeo, áudio e detalhes',8,'Mais recursos nativos sem bibliotecas.','video e audio incorporam mídia; controls habilita controle do usuário. details e summary criam uma área expansível sem JavaScript. Para mídias grandes, considere tamanho de arquivo e licenças.',['Evite vídeos que tocam automaticamente com som.','Use legendas em vídeos quando possível.','details é ótimo para perguntas frequentes.'],['<details>\n  <summary>Por que este site existe?</summary>\n  <p>Para aprender a construir a web.</p>\n</details>','details { padding:16px; border:1px solid #aaa; border-radius:10px; }',''],'Crie uma seção de perguntas com três details.','Qual tag é o título clicável de details?', ['summary','title','caption'],0,'summary rotula a área expansível.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Reference/Elements/details']
]},
{ id:'css', nome:'CSS e identidade', nivel:'Iniciante', cor:'#f5b67e', resumo:'Cor, fundo, fonte, seleção, caixas e efeitos visuais.', aulas:[
['sintaxe','Como ler uma regra CSS',8,'Seletor, propriedade e valor.','Uma regra como h1 { color: red; } escolhe os h1 e define a cor. Propriedade e valor são separados por dois pontos; declarações terminam com ponto e vírgula. Em HTML, style contém apenas CSS — nunca tags de conteúdo.',['Seletor diz em quem aplicar.','Chaves abrem e fecham um bloco de declarações.','Uma propriedade desconhecida costuma ser ignorada pelo navegador.'],['<h1>Aprendendo CSS</h1>\n<p>Uma propriedade de cada vez.</p>','h1 { color: #75e0b9; font-size: 38px; }\np { color: #c8d5e3; }',''],'Mude apenas color, depois font-size e depois font-family.','Qual parte de h1 { color: red; } é a propriedade?', ['h1','color','red'],1,'color é o nome da propriedade.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Styling_basics'],
['seletores','Selecionar tag, classe e ID',9,'Entenda h1, .cartao e #menu.','Seletores indicam quais elementos receberão estilos. O nome de uma tag seleciona todas daquele tipo; .classe seleciona elementos com uma classe; #id seleciona um elemento com determinado id. É possível combinar seletores.',['Use classes para componentes reutilizáveis.','Evite depender de IDs para todo o CSS.','Especificidade influencia qual estilo vence quando há conflito.'],['<h1 id="principal">Meu mural</h1>\n<p class="destaque">Primeiro</p><p class="destaque">Segundo</p>','h1 {color:white;}\n.destaque {color:#78e8c7;}\n#principal {text-transform:uppercase;}',''],'Crie uma classe e aplique em três parágrafos.','Como selecionar a classe caixa?', ['caixa','#caixa','.caixa'],2,'O ponto indica classe em CSS.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/CSS_selectors'],
['cores','Cores, transparência e variáveis',9,'Construa paletas consistentes.','CSS aceita cores nomeadas, hexadecimal, rgb() e hsl(). Variáveis definidas com --nome podem ser lidas com var(--nome), evitando repetir a mesma cor pelo site inteiro.',['Contraste é essencial para texto ser legível.','Use um conjunto pequeno de cores de papel, texto e destaque.','Variáveis facilitam criar temas claros e escuros.'],['<div class="cartao"><h2>Paleta própria</h2><p>O visual tem uma lógica.</p></div>',':root {--destaque:#6ee7bf;--papel:#172331;}\n.cartao {background:var(--papel);color:white;padding:22px;border-radius:18px;}\nh2 {color:var(--destaque);} ',''],'Crie variáveis para fundo, texto e detalhe e altere o visual todo.','Como usar uma variável CSS?', ['use(cor)','var(--cor)','--cor()'],1,'var(--cor) recupera a variável personalizada.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/Using_CSS_custom_properties'],
['fundo','Imagens de fundo sem confusão',10,'background-image, cover, position e repeat.','background-image define um fundo. background-size: cover preenche a área podendo cortar partes da imagem. contain mostra tudo, podendo sobrar espaço. O link deve apontar para um recurso acessível; imagens copiadas de miniaturas de busca podem falhar.',['Use aspas no url() quando facilitar a leitura.','background-position: center mantém o centro em destaque.','Um overlay semitransparente pode melhorar contraste dos textos.'],['<div class="capa"><h1>Outro eu</h1><p>Meu espaço na web.</p></div>','.capa {min-height:260px;padding:28px;color:white;background:linear-gradient(90deg,#071827bb,#07182766),url("https://picsum.photos/900/450") center / cover no-repeat;border-radius:22px;}',''],'Troque o endereço da foto por um arquivo seu e teste cover versus contain.','O que cover faz?', ['Repete a imagem','Preenche a caixa e pode cortar a imagem','Desliga o fundo'],1,'cover cobre a região inteira, mesmo que precise recortar.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/background-size'],
['fontes','Tipografia que parece profissional',8,'font-family, size, weight, line-height.','A fonte define a personalidade da página, mas legibilidade vem primeiro. Use tamanho relativo (rem), altura de linha confortável e poucos pesos. Fontes locais ou fontes padrão do sistema evitam dependências externas.',['line-height aumenta o conforto de textos longos.','font-weight define espessura como 400 ou 700.','text-align deve acompanhar a função do conteúdo.'],['<h1>Diário de criação</h1>\n<p>Hoje construí mais uma parte do meu universo digital.</p>','body {font-family:system-ui,sans-serif;}h1 {font-size:2.4rem;letter-spacing:-.04em;}p {font-size:1rem;line-height:1.7;max-width:55ch;}',''],'Compare line-height 1 e 1.7 no parágrafo.','Qual propriedade altera a altura entre linhas?', ['letter-spacing','line-height','display'],1,'line-height controla o espaçamento vertical entre linhas de texto.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/font'],
['caixa','O modelo de caixa: margem e padding',10,'A diferença que organiza quase tudo.','Todo elemento tem conteúdo, padding (espaço por dentro), borda e margin (espaço por fora). box-sizing: border-box facilita controlar as dimensões. confundir margin e padding é um erro muito comum.',['padding separa o conteúdo da borda.','margin separa uma caixa das outras.','border-radius arredonda cantos, não altera o padding.'],['<div class="caixa">Dentro da caixa</div>','.caixa {background:#2a4057;color:white;padding:24px;margin:20px;border:2px solid #70e5c3;border-radius:16px;box-sizing:border-box;}',''],'Troque os valores de margin e padding e observe o que muda.','Qual propriedade cria espaço DENTRO da borda?', ['margin','padding','gap'],1,'padding é o espaço interno.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Styling_basics/Box_model'],
['borda-sombra','Bordas, sombras e profundidade',7,'Use detalhes para separar os elementos.','border destaca contornos e box-shadow cria profundidade. Bons cartões geralmente usam uma borda sutil e uma sombra leve, sem exagerar em efeitos que distraiam do conteúdo.',['box-shadow aceita deslocamento, desfoque, expansão e cor.','border-radius pode ser aplicado a cartões e imagens.','Estados hover devem complementar, não substituir a informação.'],['<div class="cartao"><h2>Projeto pessoal</h2><p>Em construção</p></div>','.cartao {padding:22px;background:#24394b;color:white;border:1px solid #597181;border-radius:18px;box-shadow:0 14px 34px #0005;}',''],'Teste sombras mais suaves e mais intensas e escolha uma.','Qual propriedade cria sombra de caixa?', ['text-shadow','box-shadow','outline'],1,'box-shadow cria sombra na caixa.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/box-shadow'],
['hover','Hover, focus e transições',9,'Feedback quando alguém interage.','hover se aplica quando um dispositivo aponta para o elemento; focus-visible ajuda usuários de teclado a enxergarem o foco. transition suaviza mudanças de propriedades. Não confie só em hover no celular.',['Botões devem indicar claramente que são clicáveis.','Preserve foco visível para navegação por teclado.','prefers-reduced-motion permite respeitar quem prefere menos animação.'],['<button class="acao">Passe o mouse ou foque</button>','.acao {padding:14px 24px;border:0;border-radius:12px;background:#70e4c1;color:#132333;transition:transform .2s,background .2s;} .acao:hover {transform:translateY(-3px);background:#b4ffe7;} .acao:focus-visible {outline:3px solid white;outline-offset:3px;}',''],'Crie um botão que muda de cor em hover e tem foco visível.','Que pseudo-classe é importante para teclado?', [':hover',':focus-visible',':empty'],1,'focus-visible destaca foco em interações apropriadas, como teclado.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/:focus-visible'],
['cascata','Cascata, especificidade e herança',11,'Por que um estilo parece “não funcionar”?','Vários estilos podem atingir o mesmo elemento. A cascata considera origem, importância, camadas, especificidade e ordem. Uma classe pode vencer um seletor simples de tag. Algumas propriedades, como color, geralmente são herdadas.',['Use o inspetor para descobrir qual regra venceu.','Evite !important como solução automática.','Organize suas regras por componentes e responsabilidade.'],['<h1 class="especial">Qual cor vence?</h1>','h1 {color:tomato;} .especial {color:#80e7ca;}',''],'Troque a ordem das duas regras e veja se a cor muda.','Qual seletor costuma ter maior especificidade?', ['h1','.especial','*'],1,'Classe é mais específica do que seletor de tipo.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/CSS_cascade/Specificity'],
['unidades','px, rem, %, vw e clamp',10,'Dimensione sem quebrar a página.','px é uma unidade fixa de CSS. rem depende do tamanho da fonte raiz. % depende do contexto, vw depende da largura da janela e clamp() limita um valor fluido entre mínimo e máximo.',['Use rem para fontes e espaçamentos escaláveis.','Evite larguras fixas enormes no celular.','clamp() serve para títulos que crescem com a tela sem exagerar.'],['<h1>Título que se adapta</h1><p>Redimensione a tela.</p>','h1 {font-size:clamp(1.6rem,5vw,3.4rem);}p {max-width:60ch;line-height:1.6;}',''],'Aplique clamp() a um h1 e teste em uma tela estreita.','Que função estabelece mínimo, preferido e máximo?', ['rgb()','clamp()','url()'],1,'clamp(min, preferido, max) limita o tamanho responsivo.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/clamp']
]},
{ id:'layout', nome:'Layout e telas', nivel:'Intermediário', cor:'#e4a9f9', resumo:'Flexbox, Grid, posicionamento e interfaces que funcionam no celular.', aulas:[
['display','Block, inline e display',9,'Entenda o fluxo normal do navegador.','Elementos em bloco tendem a ocupar a largura disponível; elementos inline ficam no fluxo do texto. display altera como a caixa participa do layout. display:none remove a caixa do layout e normalmente da árvore de acessibilidade.',['h1 e div são blocos por padrão.','a e span são elementos inline por padrão.','inline-block mistura comportamento em linha com dimensões configuráveis.'],['<span class="item">Um</span><span class="item">Dois</span>','.item {display:inline-block;padding:12px;margin:6px;background:#2c4764;color:white;border-radius:10px;}',''],'Compare display: block, inline e inline-block nas caixas.','Qual propriedade muda o modelo de exibição?', ['display','position','overflow'],0,'display controla a exibição da caixa.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/display'],
['flex','Flexbox para menus e alinhamento',11,'Alinhe itens em uma dimensão.','display:flex distribui itens numa linha ou coluna. justify-content atua no eixo principal e align-items no eixo transversal. gap dá espaço consistente entre os itens.',['flex-direction: column empilha os itens.','flex-wrap: wrap permite quebrar linhas.','Flexbox é ótimo para cabeçalhos, menus e grupos de botões.'],['<nav class="menu"><a href="#">Início</a><a href="#">Projetos</a><a href="#">Sobre</a></nav>','.menu {display:flex;flex-wrap:wrap;gap:16px;justify-content:center;background:#21384d;padding:18px;border-radius:14px;}a {color:#8df1d0;}',''],'Crie um menu horizontal e depois mude para column.','Qual propriedade cria espaço entre itens flex?', ['gap','padding-top','z-index'],0,'gap define intervalos entre itens do layout.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/CSS_flexible_box_layout'],
['grid','CSS Grid para painéis e galerias',12,'Organize conteúdo em linhas e colunas.','Grid é excelente para layouts bidimensionais. grid-template-columns define colunas; repeat() evita repetição; minmax() estabelece mínimos e máximos. Você pode criar uma grade responsiva em uma linha.',['Use grid quando linhas e colunas importam juntas.','auto-fit pode distribuir cartões conforme espaço.','Evite obrigar três colunas estreitas no celular.'],['<div class="grade"><div>HTML</div><div>CSS</div><div>JS</div></div>','.grade {display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;} .grade>div {background:#27425e;color:white;border-radius:12px;padding:22px;text-align:center;}',''],'Crie quatro cartões usando repeat(auto-fit,minmax(...)).','Qual display ativa Grid?', ['grid','table','inline'],0,'display:grid ativa o sistema Grid.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/CSS_grid_layout'],
['responsivo','Design responsivo e meta viewport',11,'Seu site precisa existir também no celular.','Um site responsivo se adapta a diferentes larguras e formas de interação. A meta viewport no head permite ao celular dimensionar a página corretamente. Combine unidades flexíveis, conteúdo fluido e media queries.',['Teste com largura pequena antes de publicar.','Use max-width para evitar linhas de texto excessivamente longas.','Não deixe botões ou links difíceis de tocar.'],['<main class="conteudo"><h1>Do celular ao computador</h1><p>Sem largura gigante.</p></main>','.conteudo {width:min(90%,900px);margin:auto;padding:24px;background:#243b51;color:white;}',''],'Altere a largura da prévia para testar o conteúdo.','Qual meta tag ajuda a definir largura móvel?', ['charset','viewport','description'],1,'meta name="viewport" configura a viewport.','https://developer.mozilla.org/pt-BR/docs/Web/HTML/Viewport_meta_tag'],
['media','Media queries na prática',10,'Ajuste o visual por condições de tela.','@media permite aplicar CSS sob determinadas condições, como a largura da viewport ou preferência por movimento reduzido. Desenhe primeiro o comportamento básico e adicione mudanças nos pontos onde o layout realmente precisa.',['@media (min-width: 700px) é um ponto de mudança possível.','Breakpoints devem nascer do conteúdo, não só do nome do aparelho.','Respeite prefers-reduced-motion em animações.'],['<div class="colunas"><div>Menu</div><div>Conteúdo</div></div>','.colunas {display:grid;gap:12px;} .colunas>div{padding:25px;background:#31516a;color:white;} @media(min-width:650px){.colunas{grid-template-columns:180px 1fr;}}',''],'Mude a largura do navegador e observe as colunas aparecerem.','Que regra cria CSS condicional?', ['@import','@media','@font-face'],1,'@media aplica regras conforme condição.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/CSS_media_queries/Using_media_queries'],
['position','Position, z-index e camadas',10,'Fixar sem bagunçar.','position: relative mantém o espaço e permite deslocamento; absolute se posiciona em relação a um ancestral posicionado; fixed se relaciona com a viewport; sticky gruda dentro de seu contexto de rolagem. z-index ordena camadas em contextos aplicáveis.',['Evite usar absolute para montar todo o layout.','Sticky exige espaço e atenção ao overflow dos ancestrais.','Elementos fixos não devem cobrir conteúdo importante.'],['<div class="area"><span class="selo">NOVO</span><h2>Cartão</h2><p>Exemplo</p></div>','.area {position:relative;padding:35px;background:#2a435d;color:white;border-radius:14px;} .selo {position:absolute;top:10px;right:10px;background:#77e9c5;color:#132832;padding:5px 9px;border-radius:7px;font-size:12px;}',''],'Crie uma etiqueta no canto superior de um cartão com absolute.','Qual propriedade fixa um elemento em relação à janela?', ['static','fixed','inherit'],1,'fixed prende a caixa à viewport.','https://developer.mozilla.org/pt-BR/docs/Web/CSS/position'],
['componentes','Componentes visuais reutilizáveis',11,'Pare de copiar 30 estilos diferentes.','Um componente é uma peça visual consistente: cartão, botão, menu, alerta. Classes reutilizáveis e variáveis de tema tornam o projeto mais fácil de manter. Um design system define cores, espaçamentos e comportamentos de modo consistente.',['Escreva uma classe .btn que funcione em vários locais.','Use variantes com classes adicionais quando necessário.','Comece pelo layout e depois refine a decoração.'],['<button class="btn">Salvar</button> <button class="btn secundario">Cancelar</button>','.btn {padding:12px 20px;border:0;border-radius:12px;background:#79e9c5;color:#152b39;font-weight:bold;} .btn.secundario{background:#314a61;color:white;}',''],'Construa .card, .btn e .titulo reutilizáveis.','O que mais facilita manter vários botões iguais?', ['Classes reutilizáveis','Estilo inline em cada um','Copiar sem revisar'],0,'Classes compartilhadas reduzem repetição.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Styling_basics/Getting_started']
]},
{ id:'javascript', nome:'JavaScript de verdade', nivel:'Intermediário', cor:'#ffd97b', resumo:'Programação, eventos, decisões, funções e manipulação do site.', aulas:[
['js-o-que','O papel do JavaScript',8,'Da página parada à página interativa.','JavaScript é uma linguagem de programação que roda no navegador e pode reagir a ações, modificar elementos e trabalhar com dados. Ela não substitui HTML e CSS; soma comportamento. Não é obrigatório para todo site, mas abre novas possibilidades.',['Use JS quando houver comportamento dinâmico.','Separe lógica de apresentação sempre que fizer sentido.','O console do navegador ajuda a testar mensagens e valores.'],['<h1 id="mensagem">Olá</h1>','h1 {color:#86ebcd;}','document.querySelector("#mensagem").textContent = "Olá, JavaScript!";'],'Troque o texto de um elemento pelo JS.','Qual método encontra o primeiro elemento por seletor CSS?', ['querySelector','styleSheet','parseInt'],0,'querySelector procura o primeiro elemento correspondente.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide'],
['variaveis','Variáveis: let, const e tipos',10,'Onde os dados moram no código.','const cria uma ligação que não pode ser reatribuída; let permite reatribuir. Valores podem ser strings, números, booleanos, objetos e mais. Evite var em código novo simples; entenda primeiro let/const.',['Use nomes que expliquem o dado.','Texto usa aspas; números não precisam.','console.log ajuda a inspecionar valores.'],['<p id="saida"></p>','','const nome = "Criador";\nlet visitas = 1;\nvisitas = visitas + 1;\ndocument.querySelector("#saida").textContent = nome + " · " + visitas + " visitas";'],'Crie duas variáveis e mostre o resultado na página.','Qual declaração permite reatribuir um valor?', ['const','let','class'],1,'let foi feita para variáveis que podem receber novo valor.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Grammar_and_types'],
['condicao','Condições: if, else e comparação',9,'Decisões baseadas em valores.','if executa código quando uma condição é verdadeira. else define o caminho alternativo. === compara valor e tipo sem coerção automática; operadores como >, < e && ajudam a compor regras.',['Use === como comparação padrão.','Condições precisam resultar em valor verdadeiro/falso.','Não confunda = (atribuição) com === (comparação).'],['<p id="resultado"></p>','','const idade = 17;\nif (idade >= 18) {\n  document.querySelector("#resultado").textContent = "Maior de idade";\n} else {\n  document.querySelector("#resultado").textContent = "Menor de idade";\n}'],'Crie uma condição que classifica uma nota acima ou abaixo de 7.','Qual operador compara valor e tipo?', ['=','===','=>'],1,'=== faz comparação estrita.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Control_flow_and_error_handling'],
['funcoes','Funções e parâmetros',10,'Pare de repetir blocos de código.','Uma função agrupa instruções que você pode chamar várias vezes. Parâmetros recebem informações na chamada e return devolve um resultado. Funções pequenas e bem nomeadas são mais fáceis de testar e reutilizar.',['Parâmetros são entradas da função.','return envia um valor para quem chamou.','Um nome claro explica o que a função faz.'],['<p id="saida"></p>','','function saudacao(nome) {\n  return "Bem-vindo, " + nome + "!";\n}\ndocument.querySelector("#saida").textContent = saudacao("Visitante");'],'Crie uma função somar(a,b) que retorne a soma.','Qual comando devolve um valor de função?', ['console','return','break'],1,'return define o valor devolvido pela função.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Functions'],
['eventos','Cliques, inputs e eventos',11,'Escute o que a pessoa faz na página.','addEventListener registra uma função que será executada quando um evento acontecer. Eventos comuns incluem click, input, change, submit e keydown. É preferível conectar eventos em JS do que misturar muitos atributos onclick no HTML.',['A ação existe quando o usuário interage.','Use type="button" em botões que não enviam formulários.','submit exige atenção para não recarregar a página sem querer.'],['<button id="contar" type="button">Clique aqui</button><p id="resultado">0</p>','','let total=0;\ndocument.querySelector("#contar").addEventListener("click",()=>{\n total++; document.querySelector("#resultado").textContent=total;\n});'],'Monte um contador de cliques com um botão.','Que método registra um evento?', ['listen()','addEventListener()','eventCSS()'],1,'addEventListener vincula o comportamento ao evento.','https://developer.mozilla.org/pt-BR/docs/Web/API/EventTarget/addEventListener'],
['dom','DOM: alterar a página',11,'Encontre, crie e atualize elementos.','DOM é a representação do HTML como objetos manipuláveis pelo JavaScript. Você pode localizar elementos, mudar textContent, adicionar classes ou criar nós. textContent é adequado para texto do usuário porque não interpreta HTML.',['querySelector e querySelectorAll localizam elementos.','classList.add/remove/toggle mexe nas classes.','Evite inserir entrada não confiável diretamente com innerHTML.'],['<button id="mudar">Mudar aparência</button><p id="frase">Estado original</p>','.ativo {color:#6ce6bf;font-weight:bold;}','document.querySelector("#mudar").addEventListener("click",()=>{document.querySelector("#frase").classList.toggle("ativo");});'],'Faça um botão que alterna entre tema claro e escuro.','Que propriedade insere texto sem interpretar HTML?', ['innerHTML','textContent','outerHTML'],1,'textContent trata o conteúdo como texto.','https://developer.mozilla.org/pt-BR/docs/Web/API/Document_Object_Model'],
['arrays','Arrays e loops',10,'Trabalhe com coleções.','Arrays guardam listas de itens. for...of percorre valores, map transforma itens, filter seleciona alguns. Use loops quando o mesmo tipo de operação precisa acontecer para vários dados.',['Arrays começam no índice zero.','push adiciona itens ao final de um array.','map devolve um novo array transformado.'],['<ul id="lista"></ul>','','const gostos=["Música","Café","Sites"];\nfor (const gosto of gostos) {\n const li=document.createElement("li"); li.textContent=gosto; document.querySelector("#lista").append(li);\n}'],'Crie uma lista dinâmica com cinco itens.','Que estrutura guarda uma lista ordenada de valores em JS?', ['Array','Boolean','CSS'],0,'Array armazena vários valores em posições.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Array'],
['objetos','Objetos e propriedades',10,'Agrupe informações que pertencem juntas.','Objetos representam entidades com propriedades e métodos. Um perfil pode ter nome, interesses e status; acessar perfil.nome recupera uma propriedade. JSON é um formato de troca de dados parecido com objetos JS, mas com regras próprias.',['Chaves identificam propriedades do objeto.','Notação com ponto funciona para nomes simples.','JSON.stringify converte dados para string JSON.'],['<p id="perfil"></p>','','const perfil={nome:"Visitante",interesse:"Criar sites",nivel:1};\ndocument.querySelector("#perfil").textContent=perfil.nome+" — "+perfil.interesse;'],'Crie um objeto que represente um projeto com nome, status e categoria.','Qual expressão acessa nome no objeto pessoa?', ['pessoa->nome','pessoa.nome','pessoa:nome'],1,'Notação de ponto acessa propriedades.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Working_with_objects'],
['strings','Strings, templates e números',9,'Monte textos e cálculos sem bagunça.','Strings são textos. Template literals usam crases e permitem interpolação ${...}. Number() converte entradas para número, quando adequado. A entrada de um input é texto mesmo quando parece um número.',['Converta valores antes de somar numericamente.','Métodos como trim() removem espaços nas pontas.','Use isNaN ou Number.isNaN para verificar resultados inválidos.'],['<input id="n" type="number" value="5"><button id="dobrar">Dobrar</button><p id="saida"></p>','','document.querySelector("#dobrar").addEventListener("click",()=>{const n=Number(document.querySelector("#n").value);document.querySelector("#saida").textContent=`Dobro: ${n*2}`;});'],'Leia um input e mostre o triplo do valor.','Qual função converte "5" em número?', ['String()','Number()','alert()'],1,'Number("5") produz o número 5.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/Number'],
['debug-js','Console, erros e depuração',11,'Quando nada acontece, procure evidências.','Erros JavaScript aparecem no console do navegador. SyntaxError sugere estrutura inválida; ReferenceError pode indicar nome inexistente; TypeError frequentemente significa uso incorreto de um valor. Observe linha, mensagem e reproduza o problema no menor exemplo possível.',['Abra as ferramentas do desenvolvedor (normalmente F12 no desktop).','console.log mostra valores; console.error destaca falhas.','Verifique se o elemento HTML existe antes de selecioná-lo.'],['<button id="teste">Testar</button>','','console.log("O script começou");\nconst botao=document.querySelector("#teste");\nbotao.addEventListener("click",()=>console.log("Clique detectado"));'],'Abra o console do laboratório, clique no botão e observe os logs.','Onde normalmente aparecem erros de JavaScript?', ['Console','Imagem de fundo','Alt da foto'],0,'O console reúne logs e erros da execução.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Howto/Tools_and_setup/What_are_browser_developer_tools'],
['tempo','setTimeout e pequenos efeitos',9,'Agende comportamento sem travar a página.','setTimeout executa uma função uma vez após um atraso. setInterval repete em intervalos até ser parado. Animações visuais contínuas costumam ser mais simples e eficientes em CSS.',['Use clearInterval para interromper repetições.','Não crie intervalos infinitos desnecessários.','O tempo é aproximado e depende do navegador.'],['<button id="acao">Mensagem daqui a pouco</button><p id="saida"></p>','','document.querySelector("#acao").addEventListener("click",()=>{document.querySelector("#saida").textContent="Aguarde...";setTimeout(()=>{document.querySelector("#saida").textContent="Cheguei!";},1000);});'],'Faça uma mensagem aparecer um segundo após um clique.','Qual função agenda uma execução única?', ['setInterval','setTimeout','requestCSS'],1,'setTimeout agenda uma chamada depois de um tempo.','https://developer.mozilla.org/pt-BR/docs/Web/API/Window/setTimeout']
]},
{ id:'aplicacoes', nome:'Aplicações reais', nivel:'Intermediário+', cor:'#87e0e8', resumo:'Dados locais, formulários, APIs, organização e projetos úteis.', aulas:[
['storage','localStorage: salvar no dispositivo',11,'Preserve informações entre visitas no mesmo navegador.','localStorage guarda pares chave/valor no navegador para aquela origem. Ele é útil em sites estáticos, como um bloco de notas ou configurações, mas não sincroniza entre aparelhos nem substitui uma conta ou banco remoto. Em navegação privada ou bloqueada, pode falhar.',['Sempre lide com indisponibilidade do storage.','Objetos podem ser serializados com JSON.stringify.','Evite armazenar senhas ou segredos no localStorage.'],['<input id="anotacao" placeholder="Sua nota"><button id="salvar">Salvar</button><p id="status"></p>','','const campo=document.querySelector("#anotacao");try{campo.value=localStorage.getItem("minha-nota")||"";}catch(e){}\ndocument.querySelector("#salvar").addEventListener("click",()=>{try{localStorage.setItem("minha-nota",campo.value);document.querySelector("#status").textContent="Salvo neste navegador";}catch(e){document.querySelector("#status").textContent="Armazenamento indisponível";}});'],'Construa um bloco de notas que permanece após recarregar a página.','Onde o localStorage guarda os dados?', ['No navegador daquela origem','Em um banco do Neocities','No HTML do servidor'],0,'localStorage é armazenamento local vinculado à origem.','https://developer.mozilla.org/pt-BR/docs/Web/API/Window/localStorage'],
['validacao','Validação de formulário',11,'Receba dados com respeito e cuidado.','Atributos required, min, max e pattern fornecem validações básicas do navegador. JS pode complementar regras e produzir mensagens amigáveis. Nunca trate validação no navegador como proteção suficiente para dados que serão processados num servidor.',['Diga exatamente o que precisa ser corrigido.','Não confunda validação de formulário com segurança de backend.','Use labels e mensagens próximas ao campo.'],['<form id="f"><label>Apelido <input id="apelido" required minlength="3"></label><button>Enviar</button></form><p id="saida"></p>','','document.querySelector("#f").addEventListener("submit",e=>{e.preventDefault();document.querySelector("#saida").textContent="Olá, "+document.querySelector("#apelido").value.trim();});'],'Adicione um campo obrigatório com no mínimo três caracteres.','Qual atributo exige preenchimento?', ['required','selected','async'],0,'required marca um campo como obrigatório.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Extensions/Forms/Form_validation'],
['json','JSON e troca de informações',9,'Formato muito usado em serviços web.','JSON representa dados como strings, números, objetos, arrays, booleanos e null. APIs frequentemente enviam respostas JSON. Em JavaScript, JSON.parse lê uma string JSON e JSON.stringify transforma um valor em texto JSON.',['JSON usa aspas duplas em nomes e strings.','JSON não permite comentários.','Não execute strings JSON como se fossem código JavaScript.'],['<pre id="saida"></pre>','','const projeto={nome:"Meu site",tags:["HTML","CSS"],publicado:false};\nconst texto=JSON.stringify(projeto,null,2);\ndocument.querySelector("#saida").textContent=texto;'],'Crie um objeto com 3 propriedades e converta para JSON.','Qual método converte objeto para JSON textual?', ['JSON.parse','JSON.stringify','JSON.styles'],1,'stringify serializa um valor JS em JSON.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Reference/Global_Objects/JSON'],
['fetch','Fetch e APIs públicas',12,'Puxe dados de outros serviços, com limites.','fetch() solicita recursos pela rede. A resposta pode ser transformada em JSON; geralmente se usa async/await e try/catch. Nem todo site permite acesso via navegador: CORS, autenticação e indisponibilidade podem bloquear. Nunca coloque chaves secretas no JS público do Neocities.',['Uma API é uma interface para trocar informações.','Verifique response.ok antes de tratar o resultado.','Mostre estados de carregamento e erro no visual.'],['<button id="carregar">Carregar dado</button><pre id="saida"></pre>','','document.querySelector("#carregar").addEventListener("click",async()=>{const saida=document.querySelector("#saida");saida.textContent="Buscando...";try{const r=await fetch("https://jsonplaceholder.typicode.com/todos/1");if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();saida.textContent=JSON.stringify(d,null,2);}catch(e){saida.textContent="Falha: "+e.message;}});'],'Conecte uma API pública gratuita e apresente os dados com tratamento de erro.','Qual mecanismo pode bloquear uma requisição entre origens?', ['CORS','padding','HTML5'],0,'A política CORS controla acesso a recursos entre origens.','https://developer.mozilla.org/pt-BR/docs/Web/API/Fetch_API'],
['modulos','Organização do JavaScript',10,'Separe responsabilidades quando o projeto crescer.','Arquivos JS podem ser divididos em módulos com import/export. Um módulo evita espalhar funções globais e ajuda a organizar códigos maiores. No navegador moderno, script type="module" usa esse sistema; ao testar arquivos locais, algumas restrições de origem podem aparecer.',['Comece com arquivos pequenos e nomes claros.','Use funções por responsabilidade.','Módulos carregados por URL podem exigir servidor local para testes consistentes.'],['<h1>Organização</h1>\n<p>Uma funcionalidade por vez.</p>','','function prepararTitulo(texto){return texto.toUpperCase();}\nconsole.log(prepararTitulo("meu projeto"));'],'Desenhe uma estrutura com index.html, style.css, app.js e dados.js.','Que palavra exporta uma função de um módulo?', ['export','include','style'],0,'export disponibiliza valores para outros módulos.','https://developer.mozilla.org/pt-BR/docs/Web/JavaScript/Guide/Modules'],
['frontend-backend','Frontend, backend e banco de dados',11,'Entenda o que o Neocities faz e o que não faz.','Frontend é a interface que roda no navegador. Backend executa regras em servidor e conversa com banco de dados; bancos armazenam registros compartilhados. Neocities é hospedagem estática, então um formulário público persistente ou login real precisa de serviço externo apropriado.',['Frontend não consegue esconder senhas e chaves no código enviado ao visitante.','SQL consulta bancos relacionais; não substitui HTML.','Node.js ou Python podem executar backend em outro tipo de hospedagem.'],['<h1>Meu frontend</h1>\n<p>Esta parte roda no navegador.</p>','',''],'Escreva um exemplo de função frontend, backend e banco de dados.','Login com verificação segura de senha geralmente exige...', ['Apenas CSS','Um serviço de autenticação/backend','Somente uma tag input'],1,'Autenticação real precisa de lógica confiável fora do código público do cliente.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Extensions/Server-side/First_steps'],
['performance-app','Estado da aplicação e boas interfaces',11,'Controle o que a interface deve exibir.','Estado é o conjunto de dados atuais: contador, filtro, guia selecionada ou anotações. Uma aplicação clara guarda o estado, atualiza conforme eventos e redesenha o que mudou. Não é necessário aprender um framework antes de dominar esse princípio.',['Evite duplicar o mesmo dado em lugares inconsistentes.','Interface deve mostrar vazio, carregando, erro e sucesso.','Comece com lógica simples; otimize apenas quando precisar.'],['<button id="mais">+</button><span id="numero">0</span><button id="menos">−</button>','','let n=0;const mostrar=()=>document.querySelector("#numero").textContent=n;document.querySelector("#mais").onclick=()=>{n++;mostrar()};document.querySelector("#menos").onclick=()=>{n--;mostrar()};'],'Crie um filtro com três botões que altera uma lista de itens.','O que representa o estado num contador?', ['O valor numérico atual','A fonte escolhida','O arquivo index.html'],0,'Estado guarda o valor que pode mudar com as interações.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Scripting']
]},
{ id:'profissional', nome:'Padrão profissional', nivel:'Avançado', cor:'#f49dab', resumo:'Acessibilidade, SEO, performance, segurança e testes.', aulas:[
['acessibilidade','Acessibilidade de verdade',13,'Sites são para pessoas diferentes.','Acessibilidade considera teclado, leitores de tela, contraste, movimento reduzido, textos alternativos e estrutura semântica. Um site bonito que não pode ser navegado pelo teclado exclui pessoas e também dificulta manutenção.',['Navegue com Tab e Enter para testar.','Dê nome compreensível a controles e links.','Não remova outline sem alternativa de foco visível.'],['<a href="#conteudo">Pular para o conteúdo</a><main id="conteudo"><h1>Um site para todos</h1><button>Ação clara</button></main>','a:focus-visible,button:focus-visible{outline:3px solid #65e8bb;outline-offset:3px;}',''],'Teste sua página inteira usando apenas o teclado.','Qual elemento deve ter texto alternativo significativo?', ['Imagem informativa','Comentário CSS','Elemento head'],0,'Imagens informativas precisam de alternativa textual útil.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Core/Accessibility'],
['seo','SEO e metadados',10,'Ajude mecanismos e pessoas a entender a página.','Título da página, descrição, headings relevantes, conteúdo útil, URLs claras e desempenho contribuem para descoberta e compreensão. SEO não é uma fórmula mágica para aparecer primeiro. Use title e meta description no head do documento completo.',['Escreva título que identifique a página.','Evite repetir palavras-chave de forma artificial.','Use links e cabeçalhos descritivos.'],['<h1>Projetos de criação web</h1><p>Exemplos e aprendizados.</p>','',''],'Escreva um title e uma meta description claros para sua página pessoal.','Onde fica a meta description?', ['Dentro do head','Como li no ul','Dentro de CSS'],0,'Descrição é um metadado do head.','https://developers.google.com/search/docs/fundamentals/seo-starter-guide?hl=pt-br'],
['performance','Performance e Core Web Vitals',11,'Leveza é parte do design.','Uma imagem enorme atrasa carregamento; JS excessivo bloqueia interatividade; mudanças bruscas de layout confundem. Métricas como LCP, INP e CLS ajudam a avaliar carregamento, resposta e estabilidade visual.',['Compacte imagens e use formatos adequados.','Declare width e height nas imagens quando possível.','Não instale bibliotecas só por efeitos pequenos.'],['<h1>Página leve</h1><p>Sem arquivos desnecessários.</p>','',''],'Compare o tamanho de uma imagem original e uma versão comprimida.','Qual recurso costuma pesar muito numa página?', ['Imagem de alta resolução','Uma tag p','Um comentário HTML'],0,'Imagens grandes podem dominar o peso da página.','https://web.dev/articles/vitals'],
['seguranca','Segurança no frontend',12,'O que nunca colocar num site público.','Qualquer JS publicado pode ser lido pelo visitante. Nunca inclua tokens secretos, senhas ou dados pessoais. Ao receber texto do usuário, prefira textContent para evitar que seja interpretado como HTML. Segurança de dados compartilhados exige regras confiáveis no backend.',['Não use innerHTML para exibir entrada não confiável.','HTTPS ajuda a proteger o transporte, mas não torna o código automaticamente seguro.','Links externos e bibliotecas precisam de atenção e manutenção.'],['<input id="msg" placeholder="Seu texto"><button id="mostrar">Mostrar</button><div id="saida"></div>','','document.querySelector("#mostrar").addEventListener("click",()=>{document.querySelector("#saida").textContent=document.querySelector("#msg").value;});'],'Monte um pequeno mural que mostre entrada do usuário como texto, nunca como HTML.','O que NÃO deve ser publicado no app.js?', ['Uma string de interface','Uma chave secreta de serviço','Um texto de botão'],1,'Chaves secretas ficam expostas se forem enviadas ao navegador.','https://developer.mozilla.org/pt-BR/docs/Web/Security'],
['devtools','Ferramentas de desenvolvedor',11,'Inspecione o que o navegador realmente fez.','DevTools permite examinar DOM, CSS computado, rede, console, dimensões e desempenho. Quando uma cor não aparece, inspecione o elemento e descubra quais regras foram aplicadas. É uma ferramenta diária de desenvolvimento profissional.',['Elements mostra DOM e estilos.','Network mostra requisições e falhas de recursos.','Console mostra mensagens e erros JS.'],['<h1 class="titulo">Inspecione-me</h1>','.titulo {color:#6fdfb8;font-size:30px;}','console.log("Abra as ferramentas do navegador para investigar.");'],'Use o inspetor para localizar o h1 e verificar a origem da cor.','Que painel geralmente mostra requisições?', ['Network','Sources only','Elements only'],0,'Network registra as requisições da página.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Howto/Tools_and_setup/What_are_browser_developer_tools'],
['testes','Testes e critérios de qualidade',11,'De “parece funcionar” para “comprovei”.','Um teste verifica se o comportamento esperado acontece em uma situação. Para sites pequenos, comece com checklists manuais: links, teclado, mobile, formulários e console. Depois estude testes automatizados e testes de integração.',['Registre cenário, ação e resultado esperado.','Teste estados vazios e erros, não só o caminho feliz.','Corrija primeiro problemas reproduzíveis.'],['<button id="contar">Somar</button><p id="numero">0</p>','','let n=0;document.querySelector("#contar").addEventListener("click",()=>{n++;document.querySelector("#numero").textContent=n;});'],'Faça um checklist: 1 clique = 1, 2 cliques = 2, recarregar = 0.','O que é importante em um teste?', ['Resultado esperado','A cor do editor','O número de abas abertas'],0,'Testes devem declarar o comportamento esperado.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Extensions/Testing'],
['arquitetura','Arquitetura e manutenção',12,'Como crescer sem criar um monstro.','Estruture projetos por responsabilidade: conteúdo, componentes, estilos e lógica. Nomeie arquivos e funções de maneira clara, mantenha dados separados da apresentação e escreva documentação simples. Frameworks surgem como ferramentas para problemas, não como obrigação.',['Uma função deve ter responsabilidade identificável.','Comentários explicam o porquê quando necessário, não repetem o óbvio.','Refatore após compreender e testar o comportamento existente.'],['<h1>Projeto organizado</h1><p>Menos repetição, mais clareza.</p>','','function formatarNome(nome){return nome.trim();}console.log(formatarNome("  criador  "));'],'Desenhe as pastas de um site com páginas, imagens, CSS e JS.','Por que separar responsabilidades?', ['Para facilitar manutenção','Para esconder o código do usuário','Para dispensar testes'],0,'Organização ajuda a alterar peças sem quebrar as outras.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development'],
['pwa','PWA, offline e limites de hospedagem',11,'Entenda experiências parecidas com apps.','PWAs podem adicionar recursos como instalação e funcionamento offline com service workers, dependendo de contexto seguro, suporte do navegador e configuração. Um site estático pode ter funcionalidades ricas, mas nem tudo exige transformar o site em PWA.',['Service workers exigem HTTPS ou ambiente localhost compatível.','Recursos offline precisam de estratégia de cache clara.','Não presuma que todos navegadores oferecem as mesmas APIs.'],['<h1>Pronto para evoluir</h1><p>Primeiro faça o essencial funcionar bem.</p>','',''],'Liste quais partes do seu site realmente precisam funcionar sem internet.','Qual tecnologia frequentemente participa do cache offline de PWA?', ['Service worker','h1','CSS border'],0,'Service workers podem interceptar requisições e organizar cache.','https://developer.mozilla.org/pt-BR/docs/Web/Progressive_web_apps']
]},
{ id:'mundo', nome:'Ecossistema e carreira', nivel:'Profissional', cor:'#a1b4ff', resumo:'Git, publicação, tecnologias, planejamento e evolução técnica.', aulas:[
['linguagens','Linguagens e tecnologias: qual faz o quê?',12,'Pare de misturar ferramenta, linguagem e plataforma.','HTML é marcação; CSS é estilo; JavaScript e TypeScript cuidam de lógica no ecossistema web; SQL consulta dados; Python, PHP e outras linguagens podem operar no servidor. React é uma biblioteca de interface, não uma nova linguagem.',['No Neocities você começa com HTML, CSS e JS puro.','Depois de dominar fundamentos, escolha ferramentas pela necessidade do projeto.','Não é preciso aprender dez linguagens simultaneamente.'],['<h1>Meu caminho</h1><p>HTML → CSS → JavaScript → Projetos.</p>','',''],'Crie um mapa separando tecnologias de frontend, backend e dados.','Qual alternativa é uma linguagem de marcação?', ['HTML','React','Node.js'],0,'HTML estrutura conteúdo e não é uma linguagem de programação tradicional.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development'],
['git','Git e GitHub: versões do seu projeto',12,'Saiba voltar atrás sem pânico.','Git registra alterações em versões; GitHub hospeda repositórios e facilita colaboração. Commit é um registro de mudança; branch é uma linha de desenvolvimento. Neocities é a hospedagem do site, não substitui o histórico de versões de código.',['Faça backups mesmo em projetos simples.','Escreva commits que descrevam mudanças.','Não publique arquivos de senhas ou chaves no repositório.'],['<h1>Versão 1</h1><p>Uma melhoria por vez.</p>','',''],'Escreva três mensagens de commit: estrutura, estilo e interatividade.','O que um commit registra?', ['Uma alteração no histórico','Uma cor CSS','Uma imagem de fundo'],0,'Commits registram estados do projeto no versionamento.','https://docs.github.com/pt/get-started/start-your-journey/hello-world'],
['publicar','Publicar e atualizar sem quebrar',11,'Da pasta local para a internet.','Antes de publicar, valide HTML, confira nomes de arquivos, teste links relativos e faça backup. No Neocities, envie os arquivos necessários ou edite-os no painel. Se existir index.html, ele pode ser a homepage; para preservar a atual, publique páginas extras com outro nome.',['Tenha uma versão que funciona antes de grandes mudanças.','Teste no celular real, não só na largura simulada.','Após atualizar, confira a página publicada e o console.'],['<h1>Versão publicada</h1><a href="/">Voltar ao início</a>','',''],'Crie checklist de publicação com links, imagens, layout, acessibilidade e backup.','O que é mais seguro antes de trocar index.html?', ['Fazer backup','Apagar tudo','Desligar CSS'],0,'Backup permite recuperar o estado anterior.','https://neocities.org/tutorials'],
['dominio','Domínio, DNS, HTTPS e hospedagem',11,'Como um endereço encontra o site.','Domínio é o nome público; DNS ajuda a localizar o serviço; hospedagem disponibiliza arquivos; HTTPS protege a conexão. Um subdomínio do Neocities é suficiente para começar. Domínio próprio e configuração DNS são tópicos para quando fizerem sentido.',['Um domínio não é a mesma coisa que um servidor.','HTTPS não evita todos os problemas de segurança.','Mudanças de DNS podem levar tempo para propagar.'],['<h1>Meu endereço na web</h1><p>Um nome aponta para meu site.</p>','',''],'Explique a diferença entre domínio e hospedagem em uma frase cada.','O DNS está relacionado a...', ['Localização de serviços por nomes','Tamanho da fonte','Flexbox'],0,'DNS ajuda a resolver nomes em informações de rede.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Howto/Web_mechanics/What_is_a_domain_name'],
['design','UX, UI e projeto visual',11,'Design é resolver o caminho da pessoa.','UI é o conjunto de elementos visuais e controles; UX é a experiência completa ao executar tarefas. Comece pelo objetivo, organize o conteúdo e só depois defina cores, tipografia e animações. Uma interface consistente é melhor do que muitos efeitos soltos.',['Uma página deve deixar claro onde clicar.','Organize por importância e proximidade de assunto.','Use feedback de erros e sucesso compreensível.'],['<main class="painel"><h1>Um caminho claro</h1><p>Escolha o próximo passo.</p><button>Começar</button></main>','.painel {padding:28px;background:#203449;color:white;max-width:560px;border-radius:20px;}button{background:#6ee5c1;padding:12px 20px;border:0;border-radius:10px;}',''],'Desenhe no papel uma página com título, conteúdo e ação principal.','Em UX, o objetivo central é...', ['A experiência de uso','Somente a cor do botão','Usar 100 animações'],0,'UX considera toda a jornada da pessoa.','https://www.w3.org/WAI/tips/designing/'],
['processo','Um processo de desenvolvimento profissional',12,'Briefing, protótipo, execução e revisão.','Um projeto organizado começa com problema e público, define escopo, cria estrutura, implementa, testa e publica. Depois acompanha falhas e melhora. Seu portfólio deve mostrar decisões e resultado, não só um print bonito.',['Defina o mínimo que precisa funcionar primeiro.','Registre decisões e pendências.','Mantenha uma lista verificável de critérios de conclusão.'],['<h1>Projeto</h1><ol><li>Ideia</li><li>Estrutura</li><li>Código</li><li>Teste</li><li>Publicação</li></ol>','',''],'Planeje um site pessoal em cinco etapas e três critérios de pronto.','O que normalmente vem antes da decoração final?', ['Entender o objetivo','Instalar todas as bibliotecas','Esconder os erros'],0,'Definir o problema evita construir uma interface sem propósito.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development/Getting_started/Your_first_website/What_will_your_website_look_like'],
['prox-passos','Depois do Neocities: especializações',12,'Escolha um caminho quando chegar a hora.','Você pode seguir por frontend avançado (TypeScript, React), backend (Node, Python, PHP), design de interfaces, acessibilidade, segurança ou aplicações full stack. Entender HTML, CSS, JS, HTTP e Git reduz a dificuldade de qualquer caminho.',['Construa projetos completos antes de trocar de tecnologia.','Leia documentação oficial e pratique debugging.','Para backend real será preciso uma plataforma que execute servidor.'],['<h1>Meu próximo nível</h1><p>Fundamentos fortes permitem evoluir.</p>','',''],'Escolha uma especialização e planeje um projeto pequeno que a represente.','Qual etapa ajuda antes de aprender um framework?', ['Dominar os fundamentos','Ignorar o HTML','Publicar segredos no JS'],0,'Fundamentos tornam novos frameworks mais fáceis de aprender.','https://developer.mozilla.org/pt-BR/docs/Learn_web_development']
]}
];
