${String.fromCharCode(65+i)}</span>${esc(o)}${answer!==undefined&&i===a.correta?` <span style="margin-left:auto">${ico('check')}</span>`:''}</button>`).join('')}</div>${answer!==undefined?`<div class="quiz-feedback ${answer===a.correta?'good':'bad'}">${answer===a.correta?'Acertou.':'Ainda não — veja a explicação.'} ${esc(a.explicacao)} <button class="btn sm ghost" data-retry="${a.id}">Responder novamente</button></div>`:''}</section><section class="lesson-section"><h2>Próximo passo</h2><p class="prose">Depois de praticar, marque esta aula como concluída. Você pode retornar sempre que precisar.</p><div class="button-row" style="margin-top:17px"><button class="btn ${done.has(a.id)?'secondary':'primary'}" data-complete="${a.id}">${ico('checkcircle')} ${done.has(a.id)?'Desmarcar conclusão':'Marcar aula como concluída'}</button><a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${esc(a.ref)}">Documentação ${ico('external')}</a></div></section><div class="lesson-nav"><div>${prev?`<button class="btn secondary" data-nav="aula/${prev.id}">${ico('left')} Aula anterior</button>`:''}</div><div>${next?`<button class="btn primary" data-nav="aula/${next.id}">Próxima aula ${ico('arrow')}</button>`:`<button class="btn primary" data-nav="teste">Fazer revisão geral ${ico('arrow')}</button>`}</div></div></div><aside class="lesson-aside"><div class="aside-panel"><div class="eyebrow">ESTE MÓDULO</div><h3 style="margin-top:9px">${esc(mod.nome)}</h3><p>${esc(mod.resumo)}</p><div class="small-list">${mod.aulas.map((entry,i)=>`<button class="${entry[0]===a.id?'active':''}" data-nav="aula/${entry[0]}">${done.has(entry[0])?'✓ ':''}${i+1}. ${esc(entry[1])}</button>`).join('')}</div></div></aside></div>`;}
function viewLab(){return `${pageTitle('TESTE SEM QUEBRAR SEU SITE','Laboratório de código','Escreva HTML, CSS e JavaScript, execute e veja o resultado. O rascunho fica salvo neste navegador.',`<span class="chip mint">${ico('shield',13)} Prévia isolada</span>`)}<div class="lab-layout"><section class="lab-pane"><div class="lab-toolbar"><div class="tabbar" role="tablist" aria-label="Linguagem de código"><button class="tab ${labTab==='html'?'active':''}" data-lab-tab="html" role="tab" aria-selected="${labTab==='html'}">HTML</button><button class="tab ${labTab==='css'?'active':''}" data-lab-tab="css" role="tab" aria-selected="${labTab==='css'}">CSS</button><button class="tab ${labTab==='js'?'active':''}" data-lab-tab="js" role="tab" aria-selected="${labTab==='js'}">JS</button></div><button class="btn sm primary" data-lab-action="run">${ico('play',14)} Executar</button></div><textarea id="code-editor" class="code-editor" spellcheck="false" aria-label="Editor de código ${labTab.toUpperCase()}">${esc(lab[labTab])}</textarea><div class="editor-bottom"><span id="editor-count">${lab[labTab].split('\n').length} linhas</span><span>Tab = 2 espaços · Salvamento local</span></div></section><section class="lab-pane"><div class="lab-toolbar"><strong>Visualização ao vivo</strong><div class="button-row"><button class="icon-btn" style="width:33px;height:33px" data-device="desktop" aria-label="Prévia desktop" title="Desktop">${ico('monitor',17)}</button><button class="icon-btn" style="width:33px;height:33px" data-device="phone" aria-label="Prévia celular" title="Celular">${ico('phone',17)}</button><button class="icon-btn" style="width:33px;height:33px" data-lab-action="run" aria-label="Atualizar prévia" title="Atualizar">${ico('refresh',17)}</button></div></div><div id="preview-viewport" class="preview-viewport ${labDevice==='phone'?'phone':''}"><iframe id="preview-frame" class="preview-frame" title="Prévia isolada do seu código" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></div><div class="console-panel" id="lab-console" aria-live="polite"><div class="console-line">Console · mensagens e erros aparecerão aqui.</div></div></section></div><div class="lab-footer"><div class="button-row"><button class="btn secondary" data-lab-action="copy">${ico('copy')} Copiar página inteira</button><button class="btn secondary" data-lab-action="download">${ico('download')} Baixar HTML</button><button class="btn secondary" data-lab-action="reset">${ico('refresh')} Voltar ao exemplo inicial</button></div><span class="lab-hint">A prévia atualiza após você parar de digitar.</span></div><div class="notice" style="margin-top:19px"><strong>Importante:</strong> a prévia é isolada para proteger o manual. Recursos como localStorage, algumas APIs externas, acesso a arquivos e permissões podem se comportar de forma diferente aqui. Para testar persistência real, publique o projeto no Neocities ou abra o HTML exportado em ambiente apropriado. O código exportado não possui essa restrição.</div>`;}
function labSaveCode(){const editor=$('#code-editor');if(editor){lab[labTab]=editor.value;save('lab',lab);}};
function initializeLab(){const e=$('#code-editor');e.addEventListener('input',()=>{labSaveCode();$('#editor-count').textContent=e.value.split('\n').length+' linhas';clearTimeout(labTimer);labTimer=setTimeout(runPreview,700);});e.addEventListener('keydown',event=>{if(event.key==='Tab'){event.preventDefault();const start=e.selectionStart,end=e.selectionEnd;e.setRangeText('  ',start,end,'end');labSaveCode();clearTimeout(labTimer);labTimer=setTimeout(runPreview,700);}});runPreview();}
function runPreview(){if(route()!=='laboratorio')return;const frame=$('#preview-frame');if(!frame)return;$('#lab-console').innerHTML='<div class="console-line">Prévia atualizada. Console pronto.</div>';
const bridge=`<script>(function(){function send(kind,msg){parent.postMessage({source:'codigo-vivo-preview',kind:kind,message:String(msg)},'*')}window.addEventListener('error',function(e){send('error',e.message+' (linha '+e.lineno+')')});window.addEventListener('unhandledrejection',function(e){send('error','Promise: '+String(e.reason))});var orig=console.log.bind(console);console.log=function(){send('log',[].slice.call(arguments).map(function(x){try{return typeof x==='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(' '));orig.apply(console,arguments)};})();<\/script>`;
const code=lab.js.replace(/<\/script/gi,'<\\/script');frame.srcdoc=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>${lab.css.replace(/<\/style/gi,'<\\/style')}</style></head><body>${lab.html}${bridge}<script>${code}<\/script></body></html>`;}
function viewLibrary(){return `${pageTitle('ENCONTRE EM SEGUNDOS','Dicionário de código','Pesquise uma tag, uma propriedade CSS, uma função JavaScript ou um conceito. Cada cartão traz uma explicação e um exemplo copiável.',`<span class="chip">${REFERENCIAS.length} verbetes</span>`)}<div class="filters"><input id="lib-search" class="search-input filter-search" placeholder="Ex.: background-size, head, addEventListener, margin..." value="${esc(libSearch)}" autocomplete="off" aria-label="Buscar no dicionário"><div class="filter-chips">${['Todos','HTML','CSS','JS','Conceito'].map(c=>`<button class="filter-chip ${libCategory===c?'active':''}" data-lib-category="${c}">${c}</button>`).join('')}</div></div><div id="ref-count" class="muted" style="font-size:12px;margin-bottom:13px"></div><div class="ref-grid" id="ref-list"></div>`;}
function initializeLibrary(){const input=$('#lib-search');input.addEventListener('input',e=>{libSearch=e.target.value;updateLibrary();});updateLibrary();}
function updateLibrary(){const results=REFERENCIAS.filter(r=>(libCategory==='Todos'||libCategory===r[0])&&norm(r.join(' ')).includes(norm(libSearch)));$('#ref-count').textContent=results.length+' resultados';$('#ref-list').innerHTML=results.length?results.map((r)=>`<article class="ref-card"><div class="ref-header"><b class="ref-name">${esc(r[1])}</b><span class="chip">${esc(r[0])}</span></div><p>${esc(r[2])}</p><div class="ref-code"><code>${esc(r[3])}</code><button class="copy-mini" data-copy-base64="${btoa(unescape(encodeURIComponent(r[3])))}" title="Copiar exemplo" aria-label="Copiar exemplo de ${esc(r[1])}">${ico('copy')}</button></div></article>`).join(''):'<div class="empty-state" style="grid-column:1/-1"><h3>Nenhum resultado</h3><p>Experimente um termo mais curto ou escolha outra categoria.</p></div>';}
function viewDiagnostic(){const text=diagnosticText||brokenSample;return `${pageTitle('ENTENDA ANTES DE APAGAR','Analisador de erros','Cole seu HTML e receba alertas educativos sobre problemas comuns. O verificador funciona aqui mesmo, sem enviar seu código para um servidor.')}<div class="diagnostic-grid"><section class="content-card"><div class="report-header"><h2>Seu código HTML</h2><button class="btn sm secondary" data-diag-sample>${ico('refresh')} Exemplo com erros</button></div><textarea class="diagnostic-text" id="diag-input" spellcheck="false" aria-label="Cole HTML para analisar">${esc(text)}</textarea><div class="button-row" style="margin-top:15px"><button class="btn primary" data-diag-run>${ico('bug')} Procurar problemas</button><button class="btn secondary" data-diag-clear>Limpar</button></div></section><section class="content-card"><div class="report-header"><h2>Resultados</h2><small id="diag-total">Sem análise ainda</small></div><div id="diag-results" class="result-list">${diagnosticResults?renderDiagnosticResults(diagnosticResults):'<div class="notice mint"><strong>Comece por aqui.</strong> O exemplo já contém um erro parecido com aquele do seu primeiro site: um segundo head dentro de body e tags HTML dentro do style. Clique em “Procurar problemas”.</div>'}</div></section></div><div class="notice" style="margin-top:17px"><strong>Limite da ferramenta:</strong> este diagnóstico usa verificações educativas simples, não é um compilador nem um validador completo. Para validar documentos de verdade, use também o <a href="https://validator.w3.org/" target="_blank" rel="noopener noreferrer">Validador oficial W3C</a> e o console do navegador.</div><div class="section-head"><h2 class="section-title">Estrutura correta para comparar</h2></div>${blockCode('HTML — MODELO BÁSICO',`<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Outro eu</title>\n  <style>\n    body { background:#182a3c; color:white; }\n  </style>\n</head>\n<body>\n  <header><h1>Bem-vindo ao meu mundo!</h1></header>\n  <main><p>Como você está?</p></main>\n</body>\n</html>`)}`;}
function initializeDiagnostic(){const t=$('#diag-input');t.addEventListener('input',()=>{diagnosticText=t.value;save('diagnostic',diagnosticText);});if(diagnosticResults)$('#diag-total').textContent=diagnosticResults.length+' apontamentos';}
function analyze(html){const a=[],add=(level,title,desc)=>a.push({level,title,desc});if(!html.trim()){add('warn','Cole algum código','O campo está vazio. Cole seu documento HTML para iniciar.');return a;}
const heads=(html.match(/<head(?:\s|>)/gi)||[]).length,styles=(html.match(/<style(?:\s|>)/gi)||[]).length,styleClose=(html.match(/<\/style\s*>/gi)||[]).length,openBody=/<body(?:\s|>)/i.test(html),full=/<html(?:\s|>)/i.test(html)||/<!doctype/i.test(html);
if(heads>1)add('error','Mais de um <head>','O documento deve ter um único head. Não abra outro dentro de body; para cabeçalho visível use <header>.');
if(/<body\b[\s\S]*?<head(?:\s|>)/i.test(html))add('error','<head> dentro do <body>','head é a região de metadados e deve vir antes de body. Se quiser um cabeçalho visual, use header.');
const styleMatches=[...html.matchAll(/<style(?:\s[^>]*)?>([\s\S]*?)(?:<\/style\s*>|$)/gi)];
for(const s of styleMatches){if(/<\s*(?:h[1-6]|img|p|ul|li|head|header|body|a|div|main|section)(?:\s|>|\/)/i.test(s[1])){add('error','HTML encontrado dentro de <style>','style recebe declarações CSS, não tags como h1, p ou img. Mova essas tags para dentro do body.');break;} }
if(styleMatches.some(s=>/<!--|-->/.test(s[1])))add('warn','Comentário HTML dentro de CSS','Dentro de style, use /* comentário */ em vez de <!-- comentário -->.');
if(styles!==styleClose)add('error','Tag <style> sem fechamento correspondente','Confira a quantidade e o posicionamento de <style> e </style>.');
if(full&&!/<\/html\s*>/i.test(html))add('error','Falta </html>','Um documento completo deve encerrar o elemento raiz html.');
if(openBody&&!/<\/body\s*>/i.test(html))add('error','Falta </body>','Feche o body depois de todo o conteúdo visível.');
if(full&&!/<!doctype\s+html/i.test(html))add('warn','DOCTYPE não encontrado','Para HTML moderno, coloque <!DOCTYPE html> na primeira linha.');
if(full&&!/<html[^>]*\slang\s*=/.test(html))add('warn','Idioma não definido','Adicione lang="pt-BR" ao elemento html para indicar idioma da página.');
if(full&&!/<meta[^>]*name\s*=\s*["']viewport["']/i.test(html))add('warn','Meta viewport não encontrado','No head, use <meta name="viewport" content="width=device-width, initial-scale=1"> para o layout móvel.');
if(full&&!/<title(?:\s|>)/i.test(html))add('warn','Título da aba não encontrado','Coloque <title>Nome da página</title> dentro do head.');
if((html.match(/<h1(?:\s|>)/gi)||[]).length===0&&openBody)add('warn','Nenhum <h1> encontrado','Considere usar um título principal claro dentro do body.');
const imgs=[...html.matchAll(/<img\b[^>]*>/gi)];if(imgs.some(im=>!/(?:\s|^)alt\s*=/.test(im[0])))add('warn','Imagem sem alt','Imagens informativas precisam de texto alternativo; imagens puramente decorativas podem usar alt="".');
const ids=[...html.matchAll(/\bid\s*=\s*["']([^"']+)["']/gi)].map(m=>m[1]);const dup=[...new Set(ids.filter((v,i)=>ids.indexOf(v)!==i))];if(dup.length)add('warn','IDs repetidos','Cada id deveria ser único na página. Encontrados: '+dup.join(', '));
if(/encrypted-tbn\d*\.gstatic\.com/.test(html))add('warn','Imagem de miniatura externa','Links de miniaturas de busca podem mudar ou deixar de funcionar. Hospede a imagem (com permissão de uso) entre seus próprios arquivos.');
if(/<a[^>]*target\s*=\s*["']_blank["'][^>]*>/i.test(html)&&!/<a[^>]*rel\s*=\s*["'][^"']*noopener/i.test(html))add('warn','Revise links que abrem outra aba','Para links com target="_blank", considere rel="noopener noreferrer" quando apropriado.');
if(!a.length)add('ok','Nenhum problema comum detectado','Seu código passou pelas verificações básicas. Isso não garante HTML completamente válido; valide também no W3C.');return a;}
function renderDiagnosticResults(results){return results.map(r=>`<div class="result-item"><span class="result-icon ${r.level}">${r.level==='ok'?'✓':r.level==='error'?'!':'?'}</span><div><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p></div></div>`).join('');}

function viewProject(id){const pr=PROJETOS.find(x=>x.id===id);if(!pr)return view404();const count=Object.values(checks[pr.id]||{}).filter(Boolean).length;return `<div class="project-detail"><button class="lesson-back" data-nav="projetos">${ico('left')} Voltar aos projetos</button>${pageTitle('PROJETO '+pr.numero,pr.nome,pr.descricao,`<span class="chip mint">${count}/${pr.tarefas.length} etapas</span>`)}<div class="grid-2"><div class="content-card"><div class="eyebrow">OBJETIVO</div><h2 style="margin:10px 0;font-size:20px">O que você vai entregar</h2><p class="muted">${esc(pr.objetivo)}</p><div class="project-tags" style="margin-top:18px">${pr.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><div class="content-card"><div class="eyebrow">PONTO DE PARTIDA</div><h2 style="margin:10px 0;font-size:20px">Abra um modelo e transforme</h2><p class="muted" style="font-size:13px">O modelo abre em seu laboratório e pode ser totalmente alterado.</p><button class="btn primary" style="margin-top:17px" data-project-lab="${pr.id}">${ico('code')} Abrir modelo no laboratório</button></div></div><div class="section-head"><h2 class="section-title">Checklist do projeto</h2><span class="chip">Marque quando realmente concluir</span></div><section class="content-card">${pr.tarefas.map((t,i)=>`<label class="task-row ${checks[pr.id]?.[i]?'done':''}"><input type="checkbox" data-project-check="${pr.id}:${i}" ${checks[pr.id]?.[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}</section><div class="notice mint" style="margin-top:18px"><strong>Regra de ouro:</strong> o projeto é seu. Troque textos, cores, funcionalidades e organização. O modelo apenas mostra uma saída inicial, não a única solução.</div></div>`;}
function viewTest(){if(!testSession)return `${pageTitle('REVISÃO GERAL','Teste seu conhecimento','Um teste com 20 perguntas sobre estrutura HTML, CSS, JavaScript, responsividade, Neocities e práticas profissionais.')}<div class="test-shell"><div class="test-card" style="text-align:center"><div style="width:65px;height:65px;border-radius:18px;background:#76e2bf17;color:var(--accent);display:grid;place-items:center;margin:0 auto 18px">${ico('trophy',30)}</div><h2>Pronto para se testar?</h2><p class="muted" style="margin:0 auto 22px;max-width:500px">Responda sem consultar e depois veja o resultado e o motivo de cada resposta. Seu melhor resultado fica salvo apenas neste navegador.</p><div class="chip mint" style="margin-bottom:23px">Melhor resultado: ${best}/20</div><div><button class="btn primary" data-test-action="start">Iniciar 20 perguntas ${ico('arrow')}</button></div></div></div>`;
const t=testSession;if(t.index>=PERGUNTAS_REVISAO.length){const correct=t.answers.filter((v,i)=>v===PERGUNTAS_REVISAO[i][2]).length;if(correct>best){best=correct;save('best',best);}return `${pageTitle('SEU DESEMPENHO','Revisão concluída','Use os erros para identificar quais assuntos vale rever antes de passar para a próxima etapa.')}<div class="test-shell"><section class="test-card"><div class="eyebrow">RESULTADO DO TESTE</div><div class="test-result">${correct}/20</div><p style="color:var(--muted)">${correct===20?'Excelente. Agora comprove esse conhecimento construindo.':correct>=15?'Boa base. Revise os pontos que faltaram e continue praticando.':'Você já tem um mapa do que revisar. Volte às aulas e refaça o teste quando quiser.'}</p><div class="button-row" style="margin:18px 0 28px"><button class="btn primary" data-test-action="restart">Refazer teste</button><button class="btn secondary" data-nav="trilha">Revisar trilha</button></div><h2 style="font-size:20px;margin-bottom:15px">Correção comentada</h2>${PERGUNTAS_REVISAO.map((q,i)=>`<div class="answer-review"><b style="color:${t.answers[i]===q[2]?'var(--accent)':'var(--danger)'}">${t.answers[i]===q[2]?'✓':'✕'}</b> <b>${i+1}. ${esc(q[0])}</b><p>Resposta correta: ${esc(q[1][q[2]])}. ${esc(q[3])}</p></div>`).join('')}</section></div>`;}
const q=PERGUNTAS_REVISAO[t.index];return `${pageTitle('REVISÃO GERAL','Teste seu conhecimento','Responda uma questão por vez. O resultado completo aparece ao final.')}<div class="test-shell"><div class="test-progress"><span>Questão ${t.index+1} de ${PERGUNTAS_REVISAO.length}</span><span>${Math.round(t.index/PERGUNTAS_REVISAO.length*100)}%</span></div><div class="progress-track" style="margin-bottom:19px"><div class="progress-fill" style="width:${t.index/PERGUNTAS_REVISAO.length*100}%"></div></div><section class="test-card"><div class="eyebrow">PERGUNTA ${String(t.index+1).padStart(2,'0')}</div><h2>${esc(q[0])}</h2><div class="quiz-options">${q[1].map((op,i)=>`<button class="quiz-choice ${t.chosen!==null?(i===q[2]?'correct':i===t.chosen?'wrong':''):''}" data-test-choose="${i}" ${t.chosen!==null?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span>${esc(op)}</button>`).join('')}</div>${t.chosen!==null?`<div class="quiz-feedback ${t.chosen===q[2]?'good':'bad'}">${t.chosen===q[2]?'Correto.':'Não foi dessa vez.'} ${esc(q[3])}</div><div class="button-row" style="margin-top:23px"><button class="btn primary" data-test-action="next">${t.index===PERGUNTAS_REVISAO.length-1?'Ver resultado':'Próxima pergunta'} ${ico('arrow')}</button></div>`:''}</section></div>`;}
function viewResources(){const phases=[['Fundação','HTML + CSS + Neocities','Domine estrutura, fundo, imagens, textos, links e publicações pequenas.','Primeiras páginas'],['Interfaces','Flexbox + Grid + Responsividade','Construa páginas visualmente organizadas que funcionem em telas diferentes.','Projetos pessoais'],['Programação','JavaScript + DOM + dados locais','Crie botões, formulários, estados e mini-aplicações funcionais.','Ferramentas interativas'],['Profissionalização','Acessibilidade + Git + SEO + APIs','Aprenda a testar, proteger, organizar, publicar e evoluir projetos reais.','Qualidade e manutenção']];return `${pageTitle('ALÉM DAS TAGS','Recursos e tecnologias','O manual te acompanha do primeiro HTML ao desenvolvimento mais avançado. Aqui estão as diferenças entre as tecnologias e referências para aprofundar.') }<div class="section-head"><h2 class="section-title">Mapa das tecnologias</h2></div><div class="roadmap-timeline">${phases.map((p,i)=>`<div class="phase-card"><b>ETAPA 0${i+1} · ${esc(p[3])}</b><h3>${esc(p[0])}</h3><p style="color:var(--text);font-weight:650;margin-bottom:8px">${esc(p[1])}</p><p>${esc(p[2])}</p></div>`).join('')}</div><div class="section-head"><h2 class="section-title">Quando cada linguagem entra?</h2></div><div class="content-card"><div class="roadmap-timeline">${[['HTML','Estrutura e significado de páginas. Comece por ela.'],['CSS','Visual, cores, espaços, layouts e animações.'],['JavaScript','Interação no navegador, dados, lógica e APIs.'],['TypeScript','JavaScript com verificação de tipos, geralmente convertido para JS.'],['React','Biblioteca JS para construir interfaces com componentes.'],['Python / PHP / Node.js','Opções para executar lógica em servidores; Neocities não executa backend próprio.'],['SQL','Consultas e alterações de dados em bancos relacionais.'],['Git / GitHub','Histórico de versões e trabalho em equipe; não são linguagens.']].map(x=>`<div><h3 style="font-size:15px;color:var(--accent);margin-bottom:5px">${esc(x[0])}</h3><p class="muted" style="font-size:12px">${esc(x[1])}</p></div>`).join('')}</div></div><div class="section-head"><h2 class="section-title">Fontes confiáveis para consultar</h2></div><div class="resource-grid">${RECURSOS.map(r=>`<a class="resource-card" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><span class="feature-icon">${ico('book',20)}</span><div style="flex:1"><div class="eyebrow" style="font-size:10px;margin-bottom:6px">${esc(r.tipo)}</div><h3>${esc(r.nome)}</h3><p>${esc(r.descricao)}</p></div><span class="resource-external">${ico('external')}</span></a>`).join('')}</div><div class="notice mint" style="margin-top:20px"><strong>Estratégia para você:</strong> fique em HTML, CSS e JavaScript puro até conseguir terminar alguns sites sem copiar tudo. Frameworks e backend entram quando seus projetos pedirem. O Neocities é um ótimo laboratório para essa etapa.</div>`;}
function view404(){return `${pageTitle('NÃO ENCONTRADO','Essa página não existe','Volte para o começo do manual.') }<button class="btn primary" data-nav="inicio">Ir ao início</button>`;}
function closeMenu(){$('#sidebar').classList.remove('open');$('#sidebar-mask').classList.remove('open');}
function openSearch(){$('#search-backdrop').classList.remove('hidden');searchOpen=true;$('#modal-search').value='';updateSearch('');setTimeout(()=>$('#modal-search').focus(),0);}
function closeSearch(){$('#search-backdrop').classList.add('hidden');searchOpen=false;}
function updateSearch(value){const q=norm(value.trim());const ls=AULAS.filter(a=>norm(a.titulo+' '+a.resumo+' '+a.texto+' '+a.pontos.join(' ')).includes(q)).slice(0,q?8:5);const rs=q?REFERENCIAS.filter(r=>norm(r.join(' ')).includes(q)).slice(0,6):[];let list=ls.map(a=>({type:'AULA',label:a.titulo,sub:a.moduloNome,path:'aula/'+a.id})).concat(rs.map(r=>({type:'TERMO',label:r[1],sub:r[2],path:'biblioteca',term:r[1]})));$('#modal-results').innerHTML=list.length?list.map(s=>`<button class="result-row" data-search-go="${esc(s.path)}" ${s.term?`data-search-term="${esc(s.term)}"`:''}><span class="type">${s.type}</span><span class="info"><b>${esc(s.label)}</b><p>${esc(s.sub)}</p></span>${ico('arrow',16)}</button>`).join(''):'<div class="empty-state"><h3>Nada encontrado</h3><p>Pesquise só uma parte da palavra ou tente outra categoria.</p></div>';}
window.addEventListener('hashchange',()=>render());
window.addEventListener('message',e=>{const fr=$('#preview-frame');if(!fr||e.source!==fr.contentWindow||!e.data||e.data.source!=='codigo-vivo-preview')return;const area=$('#lab-console');if(!area)return;const ln=document.createElement('div');ln.className='console-line '+(e.data.kind==='error'?'error':'log');ln.textContent=(e.data.kind==='error'?'Erro: ':'› ')+String(e.data.message).slice(0,1500);area.append(ln);area.scrollTop=area.scrollHeight;});
window.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;const typing=['INPUT','TEXTAREA'].includes(tag);if(e.key==='Escape'){if(searchOpen)closeSearch();else closeMenu();}if((e.key==='/'&&!typing)||(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();openSearch();}});
$('#modal-search').addEventListener('input',e=>updateSearch(e.target.value));$('#search-backdrop').addEventListener('click',e=>{if(e.target.id==='search-backdrop')closeSearch();});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;
if(button.matches('#toggle-menu')){$('#sidebar').classList.toggle('open');$('#sidebar-mask').classList.toggle('open');return;}
if(button.matches('#open-search')){openSearch();return;}
if(button.matches('#close-search')){closeSearch();return;}
if(button.matches('#theme-toggle')){theme=theme==='dark'?'light':'dark';save('theme',theme);document.body.classList.toggle('theme-light',theme==='light');button.innerHTML=ico(theme==='dark'?'sun':'moon');button.setAttribute('aria-label',theme==='dark'?'Ativar tema claro':'Ativar tema escuro');return;}
if(button.dataset.searchGo){const term=button.dataset.searchTerm;closeSearch();if(term){libSearch=term;libCategory='Todos';}navTo(button.dataset.searchGo);return;}
if(button.dataset.nav){navTo(button.dataset.nav);return;}
if(button.dataset.toggleModule){const x=$('#group-'+button.dataset.toggleModule);const open=x.hidden;x.hidden=!open;button.setAttribute('aria-expanded',String(open));return;}
if(button.dataset.day!==undefined){selectedDay=Number(button.dataset.day);$('#day-detail').innerHTML=dayDetail();return;}
if(button.dataset.dayDone!==undefined){const d=Number(button.dataset.dayDone);dayDone.has(d)?dayDone.delete(d):dayDone.add(d);save('days',[...dayDone]);render(true);return;}
if(button.dataset.answer){const [id,index]=button.dataset.answer.split(':');lessonAnswers[id]=Number(index);save('answers',lessonAnswers);render(true);return;}
if(button.dataset.retry){delete lessonAnswers[button.dataset.retry];save('answers',lessonAnswers);render(true);return;}
if(button.dataset.complete){done.has(button.dataset.complete)?done.delete(button.dataset.complete):done.add(button.dataset.complete);save('done',[...done]);render(true);toast(done.has(button.dataset.complete)?'Aula marcada como concluída.':'Conclusão desmarcada.');return;}
if(button.dataset.example){const a=findLesson(button.dataset.example);if(a){lab={...a.exemplo};save('lab',lab);labTab='html';toast('Exemplo carregado no laboratório.');navTo('laboratorio');}return;}
if(button.dataset.copyBase64){try{copy(decodeURIComponent(escape(atob(button.dataset.copyBase64))));}catch{toast('Não foi possível copiar.');}return;}
if(button.dataset.labTab){labSaveCode();labTab=button.dataset.labTab;render(true);return;}
if(button.dataset.device){labDevice=button.dataset.device;$('#preview-viewport').classList.toggle('phone',labDevice==='phone');return;}
if(button.dataset.labAction){const a=button.dataset.labAction;if(a==='run'){labSaveCode();runPreview();toast('Prévia atualizada.');}if(a==='copy'){labSaveCode();copy(compose(lab.html,lab.css,lab.js));}if(a==='download'){labSaveCode();download(compose(lab.html,lab.css,lab.js),'meu-projeto.html');}if(a==='reset'){if(confirm('Restaurar o exemplo inicial? Seu rascunho atual do laboratório será substituído.')){lab={...FIRST_CODE};save('lab',lab);render(true);toast('Exemplo inicial restaurado.');}}return;}
if(button.hasAttribute('data-diag-sample')){diagnosticText=brokenSample;diagnosticResults=null;save('diagnostic',diagnosticText);render(true);return;}
if(button.hasAttribute('data-diag-clear')){diagnosticText='';diagnosticResults=null;save('diagnostic','');$('#diag-input').value='';$('#diag-results').innerHTML='<div class="muted">Cole um código para analisar.</div>';$('#diag-total').textContent='Sem análise ainda';return;}
if(button.hasAttribute('data-diag-run')){diagnosticText=$('#diag-input').value;diagnosticResults=analyze(diagnosticText);save('diagnostic',diagnosticText);$('#diag-results').innerHTML=renderDiagnosticResults(diagnosticResults);$('#diag-total').textContent=diagnosticResults.length+' apontamentos';return;}
if(button.dataset.projectLab){const pr=PROJETOS.find(x=>x.id===button.dataset.projectLab);if(pr){lab={html:pr.modelo[0],css:pr.modelo[1],js:pr.modelo[2]};save('lab',lab);labTab='html';navTo('laboratorio');toast('Modelo do projeto carregado.');}return;}
if(button.dataset.libCategory){libCategory=button.dataset.libCategory;$$('[data-lib-category]').forEach(b=>b.classList.toggle('active',b.dataset.libCategory===libCategory));updateLibrary();return;}
if(button.dataset.testAction){const a=button.dataset.testAction;if(a==='start'||a==='restart'){testSession={index:0,chosen:null,answers:[]};}else if(a==='next'&&testSession?.chosen!==null){testSession.answers.push(testSession.chosen);testSession.index++;testSession.chosen=null;}render(true);return;}
if(button.dataset.testChoose!==undefined){if(testSession&&testSession.chosen===null){testSession.chosen=Number(button.dataset.testChoose);render(true);}return;}
});
document.addEventListener('change',e=>{const v=e.target.dataset.projectCheck;if(v){const [id,index]=v.split(':');checks[id]||={};checks[id][index]=e.target.checked;save('projects',checks);render(true);}});
$('#sidebar-mask').addEventListener('click',closeMenu);
$('#theme-toggle').innerHTML=ico(theme==='dark'?'sun':'moon');$('#theme-toggle').setAttribute('aria-label',theme==='dark'?'Ativar tema claro':'Ativar tema escuro');
render();
})();

  </script>
</body>
</html>
