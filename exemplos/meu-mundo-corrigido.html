<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outro eu — Meu mundo</title>
  <style>
    /* Tudo que está dentro de style é CSS. */
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Arial,sans-serif; color:#f5f9ff;
      background:linear-gradient(120deg,#0c1b31e8,#122746cf),
      url("fundo.jpg") center / cover fixed no-repeat, #12253a; }
    header { padding:48px 24px 20px; text-align:center; }
    h1 { font-size:clamp(2rem,6vw,4.4rem); margin-bottom:10px; }
    main { width:min(90%,720px); margin:25px auto; padding:34px; background:#13273cc9;
      border:1px solid #ffffff34; border-radius:20px; }
    h2 { color:#94ecd1; margin-top:26px; }
    li { padding:5px; }
    a { color:#9be8d4; }
    a:focus-visible { outline:3px solid white; outline-offset:5px; }
    footer { text-align:center; color:#bbccd7; padding:18px; }
  </style>
</head>
<body>
  <!-- header é visível. Não é a mesma coisa que head. -->
  <header><h1>Bem-vindo ao meu mundo!</h1><p>Uma página criada do zero.</p></header>
  <main>
    <p>Como você está?</p>
    <p>Esse site foi feito para falar sobre a minha vida.</p>
    <h2>Coisas que eu gosto</h2>
    <ul><li>Música</li><li>Energético</li><li>Café</li></ul>
    <p><a href="https://neocities.org/" target="_blank" rel="noopener noreferrer">Visite o Neocities</a></p>
  </main>
  <footer>Uma página pessoal em evolução.</footer>
</body>
</html>
